<svg xmlns="http://www.w3.org/2000/svg" width="600" height="90" viewBox="0 0 600 90" role="img" aria-labelledby="title">
  <title id="title">Hey there, I'm Buddhika 👋 · Full-Stack Developer 💻 · Open to Internships 🚀</title>
  <style>
    .type { animation: typing 15s steps(25, end) infinite; }
    .second { animation-delay: 5s; }
    .third { animation-delay: 10s; }
    @keyframes typing {
      0% { width: 0; }
      15% { width: 500px; }
      26% { width: 500px; }
      32% { width: 0; }
      100% { width: 0; }
    }
    .cursor { animation: blink 0.8s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .type { animation: none; width: 500px; }
      .second, .third { width: 0; }
      .cursor { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="line1"><rect class="type" x="50" y="16" width="0" height="58" /></clipPath>
    <clipPath id="line2"><rect class="type second" x="50" y="16" width="0" height="58" /></clipPath>
    <clipPath id="line3"><rect class="type third" x="50" y="16" width="0" height="58" /></clipPath>
  </defs>
  <g text-anchor="middle" font-family="Consolas,monospace" font-size="27" font-weight="700" fill="#70a5fd">
    <text x="300" y="55" clip-path="url(#line1)">Hey there, I'm Buddhika 👋</text>
    <text x="300" y="55" clip-path="url(#line2)">Full-Stack Developer 💻</text>
    <text x="300" y="55" clip-path="url(#line3)">Open to Internships 🚀</text>
    <text class="cursor" x="565" y="55">|</text>
  </g>
</svg>
